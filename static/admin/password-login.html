<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora-Locus admin — Password sign-in</title>
    <!-- Same theme/branding stack as the main login page. -->
    <link rel="stylesheet" href="/admin/styles/tokens.css">
    <link id="theme-tokens" rel="stylesheet" href="/theme/active.css">
    <link id="theme-effects" rel="stylesheet" href="/theme/active-effects.css">
    <link rel="stylesheet" href="/admin/login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo" id="login-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 id="login-title">Aurora Locus</h1>
                <p id="login-subtitle">Password sign-in</p>
            </div>

            <div class="login-form-container">
                <!-- Fallback password sign-in (not surfaced from the main login
                     page). Posts credentials in the request BODY as JSON; the
                     form's `method="POST"` is a safety net so a stale/failed
                     script never leaks the password into a GET URL. -->
                <form id="password-login-form" method="POST">
                    <div class="form-group">
                        <label for="admin-login-identifier">Handle or DID</label>
                        <input
                            type="text"
                            id="admin-login-identifier"
                            name="identifier"
                            placeholder="you.example.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="admin-login-password">Password</label>
                        <input
                            type="password"
                            id="admin-login-password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div id="error-message" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn-primary" id="password-login-btn">
                        <span class="btn-text">Sign in</span>
                        <span class="btn-spinner" style="display: none;">
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="12" cy="12" r="10" stroke-width="4" stroke-opacity="0.25"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-width="4"/>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="login-footer">
                    <p><a href="/admin/login.html">Back to sign in</a></p>
                    <p>Restricted Access - Admin DIDs Only</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/scripts/components/PrideHover.js"></script>
    <script src="/admin/login/password-login.js"></script>
</body>
</html>
