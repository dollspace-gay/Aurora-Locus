<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Locus admin</title>
  <link rel="stylesheet" href="/admin/styles/tokens.css">
  <link rel="stylesheet" href="/admin/styles/effects.css">
  <!-- Active named theme (§11): server-resolved token + effect CSS. No ?id ⇒
       the server serves the deployment-default theme; settings.js re-points
       these to ?id=<theme> for a per-operator preference. Loaded after the
       static substrate so a theme's :root tokens override the baseline. -->
  <link id="theme-tokens" rel="stylesheet" href="/theme/active.css">
  <link id="theme-effects" rel="stylesheet" href="/theme/active-effects.css">
  <link rel="stylesheet" href="/admin/styles/base.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <link rel="stylesheet" href="/admin/styles/pages.css">
</head>
<body>
  <a href="#content" class="skip-to-content">Skip to content</a>

  <div class="admin-container">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <!-- Sidebar mounts here via app.js -->
    </aside>

    <main id="content" class="main-content" tabindex="-1">
      <!-- Per-page modules render here via the router -->
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="palette-root"></div>

  <!-- Chart.js retained from previous build for Dashboard sparklines -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Foundation: state + dom + i18n + format + a11y + icons -->
  <script src="/admin/scripts/lib/dom.js"></script>
  <script src="/admin/scripts/lib/icons.js"></script>
  <script src="/admin/scripts/lib/i18n.js"></script>
  <script src="/admin/scripts/lib/format.js"></script>
  <script src="/admin/scripts/lib/a11y.js"></script>
  <script src="/admin/scripts/state/session.js"></script>
  <script src="/admin/scripts/state/settings.js"></script>

  <!-- API substrate -->
  <script src="/admin/scripts/api/error-translations.js"></script>
  <script src="/admin/scripts/api/client.js"></script>
  <script src="/admin/scripts/api/capabilities.js"></script>
  <script src="/admin/scripts/api/endpoints.js"></script>
  <script src="/admin/scripts/api/subscription.js"></script>

  <!-- Substrate components (substrate primitives 1, 3, 4, 5, 7, 8, 10–12, 14–15, 20) -->
  <script src="/admin/scripts/components/EntityRef.js"></script>
  <script src="/admin/scripts/components/Modal.js"></script>
  <script src="/admin/scripts/components/Toast.js"></script>
  <script src="/admin/scripts/components/StatusBadge.js"></script>
  <script src="/admin/scripts/components/Drawer.js"></script>
  <script src="/admin/scripts/components/EmptyState.js"></script>
  <script src="/admin/scripts/components/PaginationStrip.js"></script>
  <script src="/admin/scripts/components/CalendarWidget.js"></script>
  <script src="/admin/scripts/components/FilterStrip.js"></script>
  <script src="/admin/scripts/components/ThemeToggle.js"></script>
  <script src="/admin/scripts/components/CommandPalette.js"></script>
  <script src="/admin/scripts/components/ActionPanel.js"></script>
  <script src="/admin/scripts/components/BulkActionPanel.js"></script>

  <!-- Routing -->
  <script src="/admin/scripts/routing/routes.js"></script>
  <script src="/admin/scripts/routing/url-state.js"></script>
  <script src="/admin/scripts/routing/router.js"></script>

  <!-- Pages (each registers itself with the router on load) -->
  <script src="/admin/scripts/pages/Dashboard.js"></script>
  <script src="/admin/scripts/pages/Queue.js"></script>
  <script src="/admin/scripts/pages/Reports.js"></script>
  <script src="/admin/scripts/pages/ReportDetail.js"></script>
  <script src="/admin/scripts/pages/Appeals.js"></script>
  <script src="/admin/scripts/pages/AppealDetail.js"></script>
  <script src="/admin/scripts/pages/Events.js"></script>
  <script src="/admin/scripts/pages/EventDetail.js"></script>
  <script src="/admin/scripts/pages/Audit.js"></script>
  <script src="/admin/scripts/pages/AuditEntryDetail.js"></script>
  <script src="/admin/scripts/pages/Accounts.js"></script>
  <script src="/admin/scripts/pages/AccountDetail.js"></script>
  <script src="/admin/scripts/pages/RecordDetail.js"></script>
  <script src="/admin/scripts/pages/BlobDetail.js"></script>
  <script src="/admin/scripts/pages/Invites.js"></script>
  <script src="/admin/scripts/pages/InviteDetail.js"></script>
  <script src="/admin/scripts/pages/Sequencer.js"></script>
  <script src="/admin/scripts/pages/Federation.js"></script>
  <script src="/admin/scripts/pages/BlobOps.js"></script>
  <script src="/admin/scripts/pages/RateLimits.js"></script>
  <script src="/admin/scripts/pages/SystemHealth.js"></script>
  <script src="/admin/scripts/pages/Capabilities.js"></script>
  <!-- Configuration domain (was Settings; renamed v0.9 §5.5) -->
  <script src="/admin/scripts/pages/ConfigGeneral.js"></script>
  <script src="/admin/scripts/pages/ConfigUiModes.js"></script>
  <script src="/admin/scripts/pages/ConfigThemes.js"></script>
  <script src="/admin/scripts/pages/ConfigRoles.js"></script>
  <script src="/admin/scripts/pages/ConfigRolesMembers.js"></script>
  <!-- v0.9 Arc D Kryphocron domain pages (§6.4–§6.6). -->
  <script src="/admin/scripts/pages/ConfigKryphocronPolicy.js"></script>
  <!-- Stub pages for routes whose bodies ship in Arc B/D/G. register()
       is last-wins, so when an owning arc lands its real page it must
       delete that key's row from ConfigStubs.js (contract documented in
       that file's header) — load order alone is not the guard. -->
  <script src="/admin/scripts/pages/ConfigStubs.js"></script>

  <!-- App entry point — runs after all pages have registered -->
  <script src="/admin/scripts/app.js"></script>
</body>
</html>
