<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora-Locus admin — Login</title>
    <!-- Base token alias layer, then the deployment-default theme's resolved
         token + effect CSS (same routes the admin UI uses). login.js sets
         <html data-theme> from /theme/login-branding so theme-scoped rules
         (e.g. Pride's rainbow borders) apply on the pre-auth page too. -->
    <link rel="stylesheet" href="/admin/styles/tokens.css">
    <link id="theme-tokens" rel="stylesheet" href="/theme/active.css">
    <link id="theme-effects" rel="stylesheet" href="/theme/active-effects.css">
    <link rel="stylesheet" href="/admin/login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo" id="login-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 id="login-title">Aurora Locus</h1>
                <p id="login-subtitle">Personal Data Server Administration</p>
            </div>

            <div class="login-form-container">
                <!-- OAuth is Aurora's default (and only surfaced) admin sign-in.
                     login.js runs the whole ceremony as a single-page interaction:
                     on submit it POSTs these credentials to /oauth/atproto/signin
                     via fetch (establishing the AS browser session), then drives
                     the OAuth redirect flow — which finds that session and
                     auto-approves — so the operator never sees the AS signin page.
                     The form's native `method="POST" action="/admin-oauth/password-login"`
                     is the JS-off safety net: it keeps credentials in the request
                     BODY (never a GET URL). Password login is otherwise not
                     surfaced here; it also lives at /admin/password-login.html. -->
                <form id="admin-login-form" method="POST" action="/admin-oauth/password-login">
                    <div class="form-group">
                        <label for="admin-login-identifier">Handle or DID</label>
                        <input
                            type="text"
                            id="admin-login-identifier"
                            name="identifier"
                            placeholder="you.example.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="admin-login-password">Password</label>
                        <input
                            type="password"
                            id="admin-login-password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div id="error-message" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn-primary" id="oauth-login-btn">
                        <span class="btn-text">Sign in</span>
                        <span class="btn-spinner" style="display: none;">
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="12" cy="12" r="10" stroke-width="4" stroke-opacity="0.25"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-width="4"/>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="login-footer">
                    <p>Restricted Access - Admin DIDs Only</p>
                    <p class="version">v1.0.0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Pride's random rainbow button hover (no-op unless data-theme=pride). -->
    <script src="/admin/scripts/components/PrideHover.js"></script>
    <script src="/admin/login/login.js"></script>
</body>
</html>
