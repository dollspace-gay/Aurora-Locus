# Aurora-Locus CI (chainlink #94 / Phase 5.1)
#
# Two jobs run on every commit:
#
# - `sqlite-tests` — cargo build + clippy + lib tests against the
#   default SQLite backend. Fast (~2 min on a warm cache) and covers
#   the full 543-test lib suite.
#
# - `postgres-tests` — postgres_smoke_test (one round-trip per
#   manager group) + multi_instance_test (5 leader-election +
#   LISTEN/NOTIFY scenarios). Both spin up an ephemeral
#   postgres:16-alpine container per test via testcontainers-rs;
#   GitHub Actions runners ship with Docker so no extra setup needed.
#
# Both jobs must pass for a commit to be considered green. The Postgres
# job catches placeholder-syntax, bool-decode, bool-literal, and any
# future Postgres-vs-SQLite drift that the SQLite-only lib suite
# can't surface.
#
# Coverage scope decision (Phase 5.1): smoke + integration tests
# rather than the full lib suite against Postgres. The 6 smokes
# exercise every manager group; the 5 multi-instance tests exercise
# leader election + cache invalidation end-to-end. Promoting to full
# lib coverage is a future-cycle concern pending post-v0.2 experience
# showing whether the gap matters.

name: CI

on:
  # No push branch-filter — runs on every push to the fork (every
  # skydeval/v0.#-cycle branch, and any future branch). The
  # previous filter named v0.2-cycle explicitly, which silently
  # stopped firing once v0.3 / v0.4 / v0.5 work moved to new
  # branches. Never needs per-cycle editing now.
  push:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sqlite-tests:
    name: SQLite tests + lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --tests
        # Compile tests, not just lib — surfaces integration-test
        # compile errors (e.g. struct-literal missing-field gaps)
        # at the build step rather than letting them slip to the
        # clippy / test runs.
        run: cargo build --tests
      - name: cargo clippy
        # Match doll's upstream deny gate exactly: --all-targets
        # so integration tests are linted too, and -- -D warnings
        # so any warning fails the build. The v0.5 cycle-close
        # CI fix swept the prior dead_code backlog (runtime route
        # enumeration forward-substrate, db legacy factories,
        # is_held trait method, etc.); the gate is clean as of
        # that sweep.
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings
      - name: cargo test --lib
        run: cargo test --lib

  postgres-tests:
    name: Postgres tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub Actions runners come with Docker pre-installed and the
      # daemon running, so testcontainers-rs (which shells out to
      # docker for postgres:16-alpine) works without setup.
      - name: Verify Docker daemon
        run: docker version
      # postgres-client provides pg_dump and psql for the
      # backup_restore_roundtrip_on_postgres test (chainlink #95 /
      # Phase 5.2). The test skips silently if these aren't on PATH,
      # so installing them upgrades the test from skip to actually-run.
      - name: Install postgres-client (for pg_dump / psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # `--test-threads=1` because each test spins up its own Postgres
      # container; running them in parallel races on port allocation
      # under some Docker configs. Tests are short individually
      # (~3-7s each) so the serial cost is small.
      - name: cargo test --test postgres_smoke_test
        run: cargo test --test postgres_smoke_test -- --test-threads=1
      - name: cargo test --test multi_instance_test
        run: cargo test --test multi_instance_test -- --test-threads=1
