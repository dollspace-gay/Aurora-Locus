# cargo-audit: advisories that don't apply to locus, or have no fix yet.
# Each is ignored on purpose; any other advisory fails the audit.

[advisories]
ignore = [
    # rsa: the Marvin attack recovers a private key from decryption or
    # signing timing. Locus only verifies OAuth clients' RSA signatures with
    # their public keys; it holds no RSA private key.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (through k256/p256 0.13): operations meant to be
    # constant-time may branch on secret values. Locus and proto-blue sign
    # with the 0.14 curve crates (crypto-bigint 0.7); only kryphocron still
    # pulls in 0.13, until its release on 0.14. Remove this then.
    "RUSTSEC-2026-0387",
]
