{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.hostname }}
{{- range splitList "," (include "locus.handleDomains" .) }}
{{- $hosts = append $hosts (printf "*%s" .) }}
{{- end }}
{{- $hosts = uniq $hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "locus.fullname" . }}
  labels:
    {{- include "locus.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ . }}
      hosts:
        {{- toYaml $hosts | nindent 8 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "locus.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
