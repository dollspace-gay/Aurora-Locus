[package]
name = "locus-identity"
description = "PLC operations, did:web hosting, handles, resolvers, SSRF-safe fetching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
locus-core.workspace = true
locus-store.workspace = true
proto-blue-common.workspace = true
proto-blue-identity.workspace = true
proto-blue-crypto.workspace = true
proto-blue-lex-data.workspace = true
proto-blue-lex-cbor.workspace = true
proto-blue-syntax.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true
regex = "1"
reqwest.workspace = true
url.workspace = true
futures.workspace = true
hickory-resolver.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# KMS: no default features; the HTTP client is built with rustls on ring.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
