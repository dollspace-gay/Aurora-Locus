{% extends "base.html" %}
{% block content %}
<h1>{{ shell.title }}</h1>
{% if let Some(e) = error %}<div class="banner bad">{{ e }}</div>{% endif %}
<div class="card">
<p>{{ what }}</p>
<div class="banner">{{ undo }}</div>
<form class="stack" method="post" action="{{ action }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="confirm" value="yes">
<input type="hidden" name="back" value="{{ back }}">
{% for h in hidden %}<input type="hidden" name="{{ h.name }}" value="{{ h.value }}">
{% endfor %}
{% if let Some(word) = typed %}
<label for="typed">To confirm, type <code>{{ word }}</code></label>
<input type="text" id="typed" name="typed" autocomplete="off" spellcheck="false" required>
{% endif %}
<div class="row"><a class="button secondary" href="{{ back }}">Cancel</a><button class="danger" type="submit">{{ button }}</button></div>
</form>
</div>
{% endblock %}
