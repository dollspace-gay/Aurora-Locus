[package]
name = "locus-blob"
description = "Blob storage (disk, S3), upload pipeline, GC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
locus-core.workspace = true
locus-store.workspace = true
proto-blue-lex-data.workspace = true
tokio.workspace = true
futures.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
infer = "0.16"
bytes = "1"
tokio-util = { workspace = true, features = ["io"] }
# S3-compatible stores. No default features: the HTTP client is built here
# with rustls on ring, like the rest of locus.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
