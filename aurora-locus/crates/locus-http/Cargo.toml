[package]
name = "locus-http"
description = "axum routing, XRPC plumbing, pipethrough, rate limiting, handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
locus-core.workspace = true
locus-web.workspace = true
locus-store.workspace = true
locus-repo.workspace = true
locus-kryphocron.workspace = true
unicode-segmentation = "1"
base64.workspace = true
locus-auth.workspace = true
locus-identity.workspace = true
locus-mail.workspace = true
locus-blob.workspace = true
locus-sync.workspace = true
futures.workspace = true
reqwest.workspace = true
url.workspace = true
proto-blue-lex-cbor.workspace = true
proto-blue-lex-json.workspace = true
hmac.workspace = true
sha2.workspace = true
proto-blue-crypto.workspace = true
k256 = { version = "0.13", features = ["ecdsa"] }
proto-blue-common.workspace = true
proto-blue-syntax.workspace = true
proto-blue-lex-data.workspace = true
proto-blue-repo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
arc-swap.workspace = true
tracing.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
http-body-util = "0.1"
askama = "0.12"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
proto-blue-ws.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
x509-parser = "0.18"
sqlx.workspace = true
proptest = "1"

[lints]
workspace = true
