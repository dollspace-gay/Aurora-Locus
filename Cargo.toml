[package]
name = "aurora-locus"
version = "0.8.0"
edition = "2021"
authors = ["Aurora Locus Contributors"]
description = "ATProto Personal Data Server implementation in Rust"
license = "MIT OR Apache-2.0"

# v0.9 Integration hooks Phase A (#350) — Aurora-Locus becomes a Cargo
# workspace so the declaration logic lives in a structurally-firewalled
# companion crate (Layer 1 per the integration-hooks design addendum §3).
# `hooks-core` declares NO HTTP-client crate, direct or transitive — verify
# with `cargo tree --package hooks-core`. The root package is itself a member.
[workspace]
members = ["libs/hooks-core"]

[dependencies]
# AT Protocol SDK (published crate, replaces the previously vendored ./Rust-Atproto-SDK)
proto-blue = "0.3.3"

# v0.9 Integration hooks (#350) — structurally-firewalled declaration logic
# (hook types, URL validation, netaddr SSRF predicates, event-class taxonomy).
hooks-core = { path = "libs/hooks-core" }

# kryphocron substrate. v0.9 Arc D (#222) upgrades 0.2 → 0.3: the 0.3
# at-rest seam (AtRestHooks / ContentCodec / RotationOracle, Laquna as the
# default codec) + the lexicons 0.3 shape changes (postPrivate.audienceList
# object→string). kryphocron-lexicons is brought in transitively via
# kryphocron but is also declared directly so we can refer to the registry
# and tier vocabulary by name.
# v0.9 Arc D (#237a) bumps to 0.3.1: host-constructible at-rest decode
# inputs (EncodedRecord::new / DecodeContext::new) + kryphocron::VERSION +
# audit::AUDIT_EVENT_TYPES. Purely additive; #[non_exhaustive] preserved.
kryphocron = "0.3.1"
kryphocron-lexicons = "0.3"

# Argon2id password hashing (vendored from the old SDK's server_auth module)
argon2 = { version = "0.5", features = ["std"] }

# HTTP Server
axum = { version = "0.7", features = ["tokio", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "any", "chrono", "uuid"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for file-tier runtime configuration (chainlink #124).
# Loaded once at startup via `aurora_admin::load_file_tier_settings`;
# the runtime_settings table remains the hot path for setting changes.
serde_yaml = "0.9"

# Configuration
dotenv = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }

# Rate limiting
governor = "0.7"

# Redis for caching and distributed rate limiting
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Random generation
rand = "0.8"

# Blob storage (S3)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
# jsonwebtoken 10 requires picking a crypto provider feature explicitly —
# pre-10 defaulted to `rust_crypto` automatically.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Validation
validator = { version = "0.20", features = ["derive"] }
unicode-segmentation = "1.11"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Arc 17 §17.4 Step 1.5 — DNS resolver for _lexicon.<host> TXT lookups.
# Promoted from transitive to direct dep. Pure-Rust, tokio-native.
# v0.6 M1.3: bumped 0.25 -> 0.26.1 (chainlink #152). Patches
# RUSTSEC-2026-0119 (O(n^2) name compression on encode, Moderate).
# RUSTSEC-2026-0118 (NSEC3 unbounded-loop on cross-zone proof, High) is
# accepted: the DNSSEC validation path is unreachable in our build
# (default features = no __dnssec; ResolverOpts.validate=false default;
# read_system_conf never sets validate). See SECURITY.md + the
# constructor note in src/federation/dns_resolver.rs.
hickory-resolver = "0.26.1"

# WebSocket for relay support
tokio-tungstenite = "0.27"
futures-util = "0.3"

# URL encoding for search
urlencoding = "2.1"

# Sequencer/firehose event payloads are still serialised with serde_cbor;
# IPLD itself now lives in proto-blue (proto_blue::lex_data::Cid +
# proto_blue::lex_cbor for DAG-CBOR), so no top-level libipld dep is needed.
serde_cbor = "0.11"

# Async trait for blob storage
async-trait = "0.1"

# Hex encoding for CID
hex = "0.4"

# SHA-256 hashing for blob CIDs
sha2 = "0.10"

# Cooperative file locking for the SQLite-backend PDS-liveness lock
# (src/db/liveness_lock.rs). flock(2) on Unix; LockFileEx on Windows.
fs2 = "0.4"

# secp256k1 for PLC operation signing
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# P-256 (secp256r1) for DPoP JWT verification
p256 = { version = "0.13", features = ["ecdsa", "pem"] }

# Base58 encoding for multibase keys
bs58 = "0.5"

# Base32 encoding for did:plc identifiers
base32 = "0.5"

# Metrics and telemetry
prometheus = { version = "0.14", features = ["process"] }
lazy_static = "1.4"

# Regex for the Arc 8 admin-tier path filter
# (src/api/registry.rs::ADMIN_TIER_PATH_REGEX). Verified by Step
# 0 Q6 against the actual axum route table; consumers (registry
# substrate, repurposed drift test) import the single shared
# constant per V04_DESIGN.md §7.3.6.
regex = "1"

# Image processing for thumbnails and metadata
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
dashmap = "6.1.0"
moka = { version = "0.12.11", features = ["future"] }
flate2 = "1.1.5"

# TAR archive serialization for tools.aurora.admin.exportAccountForensic
# (Phase 3.8 / chainlink #105 / docs/AURORA_ADMIN_UI_DESIGN.md §8.7).
tar = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# HMAC-SHA256 used in service_auth.rs algorithm-confusion negative
# tests (§5.4.1) to forge a realistic HS256 attacker token signed
# with the ES256K public key as secret. Test-only.
hmac = "0.12"
# Capture tracing log lines in AdminAuthContext extractor tests
# (§5.4.2 / §5.3.5) so per-cause logging assertions are first-class.
tracing-test = "0.2"
# Direct access to the same query-string format axum's Query extractor
# uses, so PaginationParams deserialization can be exercised end-to-end
# in unit tests (mirrors the over-the-wire path of /xrpc handlers).
serde_urlencoded = "0.7"
# Phase 4.4 (chainlink #91): real-Postgres integration tests for
# multi-instance leader election and LISTEN/NOTIFY cache invalidation.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
