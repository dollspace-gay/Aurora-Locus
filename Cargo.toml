[package]
name = "aurora-locus"
version = "0.1.0"
edition = "2021"
authors = ["Aurora Locus Contributors"]
description = "ATProto Personal Data Server implementation in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
# AT Protocol SDK (published crate, replaces the previously vendored ./Rust-Atproto-SDK)
proto-blue = "0.2.6"

# Argon2id password hashing (vendored from the old SDK's server_auth module)
argon2 = { version = "0.5", features = ["std"] }

# HTTP Server
axum = { version = "0.7", features = ["tokio", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "any", "chrono", "uuid"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenv = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }

# Rate limiting
governor = "0.7"

# Redis for caching and distributed rate limiting
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Random generation
rand = "0.8"

# Blob storage (S3)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
# jsonwebtoken 10 requires picking a crypto provider feature explicitly —
# pre-10 defaulted to `rust_crypto` automatically.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Validation
validator = { version = "0.20", features = ["derive"] }
unicode-segmentation = "1.11"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# WebSocket for relay support
tokio-tungstenite = "0.27"
futures-util = "0.3"

# URL encoding for search
urlencoding = "2.1"

# Sequencer/firehose event payloads are still serialised with serde_cbor;
# IPLD itself now lives in proto-blue (proto_blue::lex_data::Cid +
# proto_blue::lex_cbor for DAG-CBOR), so no top-level libipld dep is needed.
serde_cbor = "0.11"

# Async trait for blob storage
async-trait = "0.1"

# Hex encoding for CID
hex = "0.4"

# SHA-256 hashing for blob CIDs
sha2 = "0.10"

# secp256k1 for PLC operation signing
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# P-256 (secp256r1) for DPoP JWT verification
p256 = { version = "0.13", features = ["ecdsa", "pem"] }

# Base58 encoding for multibase keys
bs58 = "0.5"

# Base32 encoding for did:plc identifiers
base32 = "0.5"

# Metrics and telemetry
prometheus = { version = "0.14", features = ["process"] }
lazy_static = "1.4"

# Image processing for thumbnails and metadata
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
dashmap = "6.1.0"
moka = { version = "0.12.11", features = ["future"] }
flate2 = "1.1.5"

# TAR archive serialization for tools.aurora.admin.exportAccountForensic
# (Phase 3.8 / chainlink #105 / docs/AURORA_ADMIN_UI_DESIGN.md §8.7).
tar = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# Direct access to the same query-string format axum's Query extractor
# uses, so PaginationParams deserialization can be exercised end-to-end
# in unit tests (mirrors the over-the-wire path of /xrpc handlers).
serde_urlencoded = "0.7"
# Phase 4.4 (chainlink #91): real-Postgres integration tests for
# multi-instance leader election and LISTEN/NOTIFY cache invalidation.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
